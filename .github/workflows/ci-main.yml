name: CI (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

# Placeholder CI-only — needed so prisma.config.ts's env("DATABASE_URL")
# resolves during `pnpm install` (postinstall runs `prisma generate`) and
# `pnpm build`. Neither command opens a DB connection.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  full-validation:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level moderate

      - name: Prisma validate
        run: pnpm --filter @mediasswint/web prisma:validate

      - name: Prisma generate
        run: pnpm --filter @mediasswint/web prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm --filter @mediasswint/web test:unit

      - name: Rendered behaviour tests
        run: pnpm --filter @mediasswint/web test:render

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  integration:
    name: Disposable PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: mediass_ci_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mediass_ci_probe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/mediass_ci_probe
      INTEGRATION_DATABASE_URL: postgresql://ci:ci@localhost:5432/mediass_ci_probe
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @mediasswint/web prisma:validate

      - name: Apply migrations to disposable PostgreSQL
        run: pnpm --filter @mediasswint/web exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Integration tests
        run: pnpm --filter @mediasswint/web test:integration:ci

  docker-image:
    name: Docker image (runner)
    needs: full-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runner
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: mediasswint/web:main-${{ github.sha }}
